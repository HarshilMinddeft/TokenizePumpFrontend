<body>
<three-d-stage name="dubai-elite-oasis-station" background="#2a2a30"></three-d-stage>
<div id="tour"><div class="t">Visit a business</div></div>
<script src="three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;
const PI = Math.PI;
const Y0 = 0.05;

// ---------- materials ----------
const std = (name, color, o = {}) => { const m = new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0, ...o }); m.name = name; return m; };
const glow = (name, color, i = 1.6) => std(name, color, { emissive: color, emissiveIntensity: i, roughness: 0.4 });
const M = {
  asphalt: std('asphalt', 0x2a2c30, { roughness: 0.62 }),
  marking: std('road_marking', 0xe9e9e6, { roughness: 0.7 }),
  curb: std('curb_concrete', 0xcfcac1, { roughness: 0.85 }),
  paving: std('forecourt_polished_concrete', 0xd6d0c4, { roughness: 0.3 }),
  joint: std('paving_joint', 0xa39d92, { roughness: 0.8 }),
  stone: std('travertine_cladding', 0xe2d6c1, { roughness: 0.7 }),
  white: std('facade_white', 0xf1efea, { roughness: 0.35 }),
  soffit: std('soffit_panel', 0xdedbd5, { roughness: 0.5 }),
  gold: std('bronze_trim', 0xcfa56a, { roughness: 0.28, metalness: 0.85 }),
  dark: std('dark_panel', 0x1d1f23, { roughness: 0.4, metalness: 0.2 }),
  steel: std('brushed_steel', 0xb4b8bd, { roughness: 0.3, metalness: 0.8 }),
  glass: std('glass', 0x9fb6c0, { roughness: 0.04, metalness: 0.6, transparent: true, opacity: 0.26, depthWrite: false }),
  carGlass: std('car_glass', 0x10161c, { roughness: 0.06, metalness: 0.6 }),
  interior: std('interior_wall_warm', 0xe8d0aa, { emissive: 0x7a5429, emissiveIntensity: 0.55, roughness: 0.8 }),
  interiorFloor: std('interior_floor', 0xcdb898, { emissive: 0x3d2a14, emissiveIntensity: 0.4, roughness: 0.4 }),
  ceiling: glow('ceiling_glow', 0xffe0b8, 1.1),
  ledWarm: glow('led_warm', 0xffd7a0, 2.2),
  ledBlue: glow('led_blue', 0x2f8dff, 2.4),
  ledGreen: glow('led_green', 0x3dff7a, 2),
  ledRed: glow('led_red', 0xff3030, 1.6),
  fridge: glow('fridge_light', 0xf4f8ff, 1.2),
  brandBlue: std('brand_blue', 0x1f4fb8, { roughness: 0.35, metalness: 0.2 }),
  brandRed: std('brand_red', 0xd8342f, { roughness: 0.4 }),
  grass: std('grass', 0x4a7430, { roughness: 1 }),
  soil: std('mulch', 0x3b2e24, { roughness: 1 }),
  bush: std('shrub_dark', 0x355f24, { roughness: 1 }),
  bushLight: std('shrub_light', 0x5f8e34, { roughness: 1 }),
  palm: std('palm_frond', 0x3f6c2a, { roughness: 0.75, side: THREE.DoubleSide }),
  palmDry: std('palm_frond_dry', 0x8d7a48, { roughness: 0.9, side: THREE.DoubleSide }),
  trunk: std('palm_trunk', 0x7a6046, { roughness: 1 }),
  tire: std('tire_rubber', 0x151517, { roughness: 0.85 }),
  rim: std('wheel_rim', 0xc4c7cb, { roughness: 0.25, metalness: 0.85 }),
  hose: std('fuel_hose', 0x121315, { roughness: 0.5 }),
  red: std('tool_red', 0xc0282a, { roughness: 0.4 }),
  wood: std('walnut', 0x8a6444, { roughness: 0.6 }),
  fabric: std('seat_fabric', 0x3a3530, { roughness: 0.9 }),
  solar: std('solar_panel', 0x18253a, { roughness: 0.12, metalness: 0.5 }),
  roof: std('canopy_roof_membrane', 0xe9e7e2, { roughness: 0.55 }),
  roofDeck: std('roof_deck', 0xa8a6a1, { roughness: 0.9 }),
  brush: std('wash_brush_foam', 0x2d63d8, { roughness: 0.9 }),
};
const PAINT = { black: 0x0e1013, white: 0xeef0f1, grey: 0x6d7076, silver: 0xb9bdc2, graphite: 0x33363c, sand: 0xbca98a, navy: 0x1c2a44 };
for (const k in PAINT) PAINT[k] = std('car_paint_' + k, PAINT[k], { roughness: 0.22, metalness: 0.55 });
const SHIRTS = [0xf2f2f2, 0x223457, 0x1c1c1c, 0x9b8b73, 0x365f8c, 0x7a2f2f].map((c, i) => std('clothing_' + i, c, { roughness: 0.85 }));
const PANTS = std('clothing_pants', 0x23252b, { roughness: 0.9 });
const skin = std('skin', 0xb98a66, { roughness: 0.75 });

// ---------- helpers ----------
function mesh(name, geo, mat, parent, x = 0, y = 0, z = 0) { const m = new THREE.Mesh(geo, mat); m.name = name; m.position.set(x, y, z); parent && parent.add(m); return m; }
const box = (name, w, h, d, mat, p, x = 0, y = 0, z = 0) => mesh(name, new THREE.BoxGeometry(w, h, d), mat, p, x, y + h / 2, z);
const cyl = (name, rt, rb, h, mat, p, x = 0, y = 0, z = 0, s = 32) => mesh(name, new THREE.CylinderGeometry(rt, rb, h, s), mat, p, x, y + h / 2, z);
const grp = (name, parent, x = 0, y = 0, z = 0, ry = 0) => { const g = new THREE.Group(); g.name = name; g.position.set(x, y, z); g.rotation.y = ry; parent && parent.add(g); return g; };
function rrPath(w, h, r, p = new THREE.Shape()) {
  const x = -w / 2, y = -h / 2;
  p.moveTo(x + r, y); p.lineTo(x + w - r, y); p.quadraticCurveTo(x + w, y, x + w, y + r);
  p.lineTo(x + w, y + h - r); p.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  p.lineTo(x + r, y + h); p.quadraticCurveTo(x, y + h, x, y + h - r);
  p.lineTo(x, y + r); p.quadraticCurveTo(x, y, x + r, y); return p;
}
function ringShape(w, h, r, t) { const s = rrPath(w, h, r); s.holes.push(rrPath(w - 2 * t, h - 2 * t, Math.max(r - t, 0.05), new THREE.Path())); return s; }
function flat(name, shape, depth, mat, p, x, y, z, bevel = 0) {
  const g = new THREE.ExtrudeGeometry(shape, { depth, curveSegments: 20, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 3 });
  g.rotateX(-PI / 2); g.translate(0, 0, 0); return mesh(name, g, mat, p, x, y + bevel, z);
}
function hipRoof(w, d, h, ridge) {
  const a = w / 2, b = d / 2, q = ridge / 2;
  const P = [[-a, 0, b], [a, 0, b], [q, h, 0], [-q, h, 0], [a, 0, -b], [-a, 0, -b]];
  const idx = [0, 1, 2, 0, 2, 3, 4, 5, 3, 4, 3, 2, 1, 4, 2, 5, 0, 3];
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(idx.flatMap(i => P[i]), 3)); g.computeVertexNormals(); return g;
}
let rs = 11; const rnd = () => (rs = (rs * 16807) % 2147483647) / 2147483647;

// ---------- canvas signage (textures carry into GLB; OBJ keeps panel colour) ----------
function drawLogo(ctx, cx, cy, r) {
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * PI); ctx.fill();
  ctx.fillStyle = '#1f7fd6'; ctx.beginPath(); ctx.ellipse(cx - r * .18, cy + r * .05, r * .32, r * .62, -.35, 0, 2 * PI); ctx.fill();
  ctx.fillStyle = '#e8413c'; ctx.beginPath(); ctx.ellipse(cx + r * .2, cy - r * .08, r * .28, r * .6, -.35, 0, 2 * PI); ctx.fill();
}
function sign(name, w, h, draw, parent, x, y, z, ry = 0, bg = '#17181c', ei = 0.7) {
  const px = 128, c = document.createElement('canvas');
  c.width = Math.round(w * px); c.height = Math.round(h * px);
  const ctx = c.getContext('2d'); ctx.fillStyle = bg; ctx.fillRect(0, 0, c.width, c.height);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  draw(ctx, c.width, c.height);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const mat = new THREE.MeshStandardMaterial({ map: tex, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: ei, roughness: 0.5 });
  mat.name = 'sign_' + name;
  const m = mesh('sign_' + name, new THREE.PlaneGeometry(w, h), mat, parent, x, y, z); m.rotation.y = ry; return m;
}
const F = (px, wt = 700) => `${wt} ${px}px "Helvetica Neue", Helvetica, Arial, sans-serif`;
function text(ctx, t, x, y, px, color = '#f4ead8', wt = 700, sp = 0) { ctx.font = F(px, wt); ctx.fillStyle = color; if ('letterSpacing' in ctx) ctx.letterSpacing = sp + 'px'; ctx.fillText(t, x, y); }
const lineSign = (label, sub, col = '#f6eedf') => (ctx, W, H) => {
  text(ctx, label, W / 2, sub ? H * .38 : H / 2, H * (sub ? .36 : .52), col, 700, H * .03);
  if (sub) text(ctx, sub, W / 2, H * .75, H * .22, '#d9b67a', 600, H * .03);
};

// ---------- vegetation ----------
const frondGeo = (() => {
  const g = new THREE.PlaneGeometry(5, 1, 10, 2); g.translate(2.5, 0, 0); g.rotateX(-PI / 2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i), t = x / 5;
    const wz = z * Math.min(1, t * 5) * (1 - t * 0.85);
    p.setXYZ(i, x, 0.55 * x - 0.13 * x * x - Math.abs(wz) * 0.5, wz);
  }
  g.computeVertexNormals(); return g;
})();
const ringGeo = new THREE.TorusGeometry(0.27, 0.05, 6, 16);
function palmTree(parent, x, y, z, h = 9) {
  const g = grp('palm_tree', parent, x, y, z);
  const lean = (rnd() - .5) * 1.6, ang = rnd() * PI * 2;
  const top = new THREE.Vector3(Math.cos(ang) * lean, h, Math.sin(ang) * lean);
  const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(0, 0, 0), new THREE.Vector3(top.x * .15, h * .5, top.z * .15), top]);
  const tg = new THREE.TubeGeometry(curve, 12, 0.24, 12);
  mesh('palm_trunk', tg, M.trunk, g);
  cyl('palm_trunk_flare', 0.26, 0.42, 0.7, M.trunk, g, 0, 0, 0, 12);
  for (let i = 1; i < 12; i++) { const p = curve.getPoint(i / 12); const r = mesh('trunk_ring', ringGeo, M.trunk, g, p.x, p.y, p.z); r.rotation.x = PI / 2; }
  const crown = grp('palm_crown', g, top.x, top.y, top.z);
  mesh('palm_heart', new THREE.SphereGeometry(0.42, 12, 8), M.trunk, crown);
  const n = 14;
  for (let i = 0; i < n; i++) {
    const piv = grp('frond_pivot', crown); piv.rotation.y = (i / n) * PI * 2 + rnd() * .35;
    const dry = i % 7 === 3;
    const f = mesh(dry ? 'palm_frond_dry' : 'palm_frond', frondGeo, dry ? M.palmDry : M.palm, piv);
    f.rotation.z = dry ? -0.9 : (i % 2 ? 0.25 : -0.15) + (rnd() - .5) * .3;
    f.scale.setScalar(0.85 + rnd() * .3);
  }
  return g;
}
const bushGeo = new THREE.IcosahedronGeometry(1, 2);
function bush(parent, x, y, z, s = 1) { const b = mesh('shrub', bushGeo, rnd() > .5 ? M.bush : M.bushLight, parent, x, y + s * .45, z); b.scale.set(s, s * .7, s * (0.8 + rnd() * .4)); }
function uplight(parent, x, y, z) { cyl('garden_uplight', 0.07, 0.09, 0.35, M.dark, parent, x, y, z, 12); cyl('garden_uplight_lens', 0.06, 0.06, 0.03, M.ledWarm, parent, x, y + 0.35, z, 12); }
function planter(name, x, z, w, d, palms = 0) {
  const g = grp('planter_' + name, station, x, Y0, z);
  const r = Math.min(w, d) * .45;
  flat('planter_curb', ringShape(w, d, r, 0.4), 0.5, M.curb, g, 0, 0, 0);
  flat('planter_mulch', rrPath(w - 0.7, d - 0.7, r - .35), 0.38, M.soil, g, 0, 0, 0);
  flat('planter_led', ringShape(w + 0.06, d + 0.06, r + .03, 0.06), 0.06, M.ledWarm, g, 0, 0.44, 0);
  const n = Math.round(w * d / 4.5);
  for (let i = 0; i < n; i++) bush(g, (rnd() - .5) * (w - 1.8), 0.38, (rnd() - .5) * (d - 1.8), 0.45 + rnd() * .65);
  for (let i = 0; i < Math.round((w + d) / 6); i++) uplight(g, (rnd() - .5) * (w - 1.5), 0.38, (rnd() - .5) * (d - 1.5));
  for (let i = 0; i < palms; i++) palmTree(g, palms === 1 ? 0 : (i / (palms - 1) - .5) * (w - 3), 0.38, (rnd() - .5) * Math.max(d - 3, 0), 7 + rnd() * 4.5);
  return g;
}

// ---------- vehicles & people ----------
const wheelGeo = new THREE.CylinderGeometry(0.36, 0.36, 0.25, 28); wheelGeo.rotateX(PI / 2);
const rimGeo = new THREE.CylinderGeometry(0.24, 0.24, 0.26, 20); rimGeo.rotateX(PI / 2);
const WORKER_YAW = PI; // worker GLB faces +Z; figures in this scene face -Z
const CAR_ORDER = ['mclaren', 'ferrari', 'bugatti', 'jiotto'];
const carSlots = []; let carIdx = 0;
function car(parent, paint, x, y, z, ry = 0, suv = false, model) {
  const g = grp('car_slot', parent, x, y, z, ry);
  carSlots.push({ g, model: model || CAR_ORDER[carIdx++ % CAR_ORDER.length] });
  return g;
}
const torsoGeo = new THREE.CylinderGeometry(0.2, 0.16, 0.7, 8), legGeo = new THREE.CylinderGeometry(0.08, 0.07, 0.85, 6), headGeo = new THREE.SphereGeometry(0.13, 14, 10);
const workerSlots = [];
function worker(parent, x, y, z, ry = 0, task = 'idle', bay) { const g = grp('worker_slot', parent, x, y, z, ry); workerSlots.push({ g, task, bay, ph: rnd() * 6 }); return g; }
const BAYS = { 1: { h: 1.46, lifted: true }, 2: { h: 0, lifted: false, owner: null, dynamic: true }, 3: { h: 0, lifted: false, owner: null, dynamic: true }, 4: { h: 1.46, lifted: true } };
function person(parent, x, y, z, ry = rnd() * PI * 2, shirt) {
  const g = grp('person', parent, x, y, z, ry);
  for (const s of [1, -1]) mesh('person_leg', legGeo, PANTS, g, s * 0.1, 0.45, 0);
  mesh('person_torso', torsoGeo, (shirt || SHIRTS[Math.floor(rnd() * SHIRTS.length)]), g, 0, 1.2, 0);
  mesh('person_head', headGeo, skin, g, 0, 1.7, 0); return g;
}
const hairGeo = new THREE.SphereGeometry(0.145, 14, 10, 0, PI * 2, 0, PI * 0.62);
const dressGeo = new THREE.CylinderGeometry(0.17, 0.3, 1.25, 12), shawlGeo = new THREE.SphereGeometry(0.16, 14, 10), bagGeo = new THREE.BoxGeometry(0.28, 0.24, 0.1), wTorsoGeo = new THREE.CylinderGeometry(0.16, 0.17, 0.42, 10), kanduraGeo = new THREE.CylinderGeometry(0.19, 0.26, 1.5, 12);
const DRESS = [0x141414, 0x1b1b22, 0x6b4e3d, 0xc9b79c, 0x7a2f4a, 0x2f4a6b].map((c, i) => std('dress_' + i, c, { roughness: 0.85 }));
const HAIR = std('hair_dark', 0x1a120c, { roughness: 0.8 }), KANDURA = std('kandura_white', 0xf4f2ec, { roughness: 0.8 }), BAGM = std('shopping_bag', 0xe3b766, { roughness: 0.6 });
function woman(parent, x, y, z, ry = rnd() * PI * 2, style = 0, bag = false) {
  const g = grp('person_woman', parent, x, y, z, ry), dm = DRESS[style % DRESS.length];
  mesh('woman_dress', dressGeo, dm, g, 0, 0.63, 0);
  mesh('woman_torso', wTorsoGeo, dm, g, 0, 1.46, 0);
  mesh('woman_head', headGeo, skin, g, 0, 1.78, 0);
  if (style < 2) mesh('woman_shayla', shawlGeo, dm, g, 0, 1.8, -0.02); else mesh('woman_hair', hairGeo, HAIR, g, 0, 1.8, -0.01);
  if (bag) mesh('shopping_bag', bagGeo, BAGM, g, 0.24, 0.85, 0);
  return g;
}
function man(parent, x, y, z, ry = rnd() * PI * 2, kandura = false, bag = false) {
  if (!kandura) { const g = person(parent, x, y, z, ry); if (bag) mesh('shopping_bag', bagGeo, BAGM, g, 0.26, 0.8, 0); return g; }
  const g = grp('person_man_kandura', parent, x, y, z, ry);
  mesh('kandura', kanduraGeo, KANDURA, g, 0, 0.75, 0);
  mesh('man_head', headGeo, skin, g, 0, 1.72, 0);
  mesh('ghutra', shawlGeo, KANDURA, g, 0, 1.75, -0.02);
  if (bag) mesh('shopping_bag', bagGeo, BAGM, g, 0.26, 0.8, 0);
  return g;
}
const sTorsoGeo = new THREE.CylinderGeometry(0.18, 0.17, 0.6, 10), thighGeo = new THREE.BoxGeometry(0.34, 0.14, 0.46), shinGeo = new THREE.CylinderGeometry(0.065, 0.06, 0.46, 6);
function seated(parent, x, y, z, ry, female) {
  const g = grp(female ? 'seated_woman' : 'seated_man', parent, x, y, z, ry);
  const style = Math.floor(rnd() * 6), kand = !female && rnd() < 0.45;
  const top = female ? DRESS[style] : kand ? KANDURA : SHIRTS[Math.floor(rnd() * SHIRTS.length)], leg = female ? DRESS[style] : kand ? KANDURA : PANTS;
  mesh('seated_torso', sTorsoGeo, top, g, 0, 0.8, 0.02);
  mesh('seated_thighs', thighGeo, leg, g, 0, 0.5, 0.22);
  for (const s of [1, -1]) mesh('seated_shin', shinGeo, leg, g, s * 0.09, 0.23, 0.44);
  mesh('seated_head', headGeo, skin, g, 0, 1.26, 0);
  if (female && style < 3) mesh('woman_shayla', shawlGeo, top, g, 0, 1.28, -0.02); else if (female) mesh('woman_hair', hairGeo, HAIR, g, 0, 1.28, -0.01); else if (kand) mesh('ghutra', shawlGeo, KANDURA, g, 0, 1.23, -0.02);
  return g;
}
function chair(parent, x, y, z, ry) { const c = grp('chair', parent, x, y, z, ry); box('chair_seat', 0.45, 0.06, 0.45, M.fabric, c, 0, 0.45, 0); box('chair_back', 0.45, 0.5, 0.05, M.fabric, c, 0, 0.5, -0.2); for (const [a, b] of [[.18, .18], [-.18, .18], [.18, -.18], [-.18, -.18]]) box('chair_leg', 0.03, 0.45, 0.03, M.dark, c, a, 0, b); }
